server:
  port: 1000
spring:
  application:
    name: "noted"

  security:
    oauth2:
      client:
        registration:
          github:
            clientId: "TEST_GITHUB_CLIENT_ID"
            clientSecret: "TEST_GITHUB_CLIENT_SECRET"

  datasource:
    url: "jdbc:h2:mem:test-db"
    username: "test_user"
    password: "test_password"
    driver-class-name: "org.h2.Driver"

  jpa:
    hibernate:
      ddl-auto: "create"

  h2:
    datasource:
      url: "jdbc:h2:mem:test-sessions"
      username: "test_sessions_user"
      password: "test_sessions_password"
      driver-class-name: "org.h2.Driver"
      schema: "classpath:org/springframework/session/jdbc/schema-h2.sql"
    console:
      enabled: true
      path: "/h2-console"

  session:
    store-type: "jdbc"
    jdbc:
      initialize-schema: "always"
      table-name: "SPRING_SESSION"

hibernate:
  default_fetch_mode: "select"

logging:
  level:
    org:
      springframework:
        security: DEBUG

